name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: qemu-web-manager
          - name: linux-aarch64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            binary: qemu-web-manager
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: qemu-web-manager.exe
          - name: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            binary: qemu-web-manager
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            binary: qemu-web-manager
          - name: freebsd-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-freebsd
            binary: qemu-web-manager

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Install cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-freebsd'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu clang
      - name: Build daemon
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          BIN: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          out="qemu-web-manager-${NAME}"
          mkdir -p "$out"
          cp "target/${TARGET}/release/${BIN}" "$out/"
          cp LICENSE LICENSE.md README.md ARCHITECTURE.md HARDWARE_MATRIX.md "$out/"
          tar -czf "${out}.tar.gz" "$out" || true
          if [[ "${BIN}" == *.exe ]]; then
            7z a "${out}.zip" "$out" >/dev/null
          else
            [[ -f "${out}.tar.gz" ]]
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-web-manager-${{ matrix.name }}
          path: |
            qemu-web-manager-*.tar.gz
            qemu-web-manager-*.zip

  source:
    name: Source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create AGPL source package
        run: |
          git archive --format=tar.gz --prefix=qemu-web-manager-source-AGPLv3/ HEAD > qemu-web-manager-source-AGPLv3.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-web-manager-source
          path: qemu-web-manager-source-AGPLv3.tar.gz

  release:
    name: Publish release
    needs: [build, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts and create checksums
        run: |
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} . \;
          find . -maxdepth 1 -type f \( -name 'qemu-web-manager-*.tar.gz' -o -name 'qemu-web-manager-*.zip' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            qemu-web-manager-*.tar.gz
            qemu-web-manager-*.zip
            qemu-web-manager-source-AGPLv3.tar.gz
            SHA256SUMS
