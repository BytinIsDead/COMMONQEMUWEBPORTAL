name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - name: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
          - name: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - name: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test
        run: go test ./...
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "dist/qemu-web-manager-${NAME}/web"
          go build -trimpath -ldflags='-s -w' -o "dist/qemu-web-manager-${NAME}/qemu-web-manager${EXT}" ./cmd/qemu-web-manager
          cp web/index.html web/style.css web/app.js "dist/qemu-web-manager-${NAME}/web/"
          cp LICENSE LICENSE.md README.md ARCHITECTURE.md HARDWARE_MATRIX.md "dist/qemu-web-manager-${NAME}/"
          tar -czf "qemu-web-manager-${NAME}.tar.gz" -C dist "qemu-web-manager-${NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-web-manager-${{ matrix.name }}
          path: qemu-web-manager-${{ matrix.name }}.tar.gz

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: git archive --format=tar.gz --prefix=qemu-web-manager-source-AGPLv3/ HEAD > qemu-web-manager-source-AGPLv3.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-web-manager-source
          path: qemu-web-manager-source-AGPLv3.tar.gz

  release:
    needs: [build, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare assets and checksums
        run: |
          find artifacts -type f -name '*.tar.gz' -exec cp {} . \;
          sha256sum qemu-web-manager-*.tar.gz qemu-web-manager-source-AGPLv3.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            qemu-web-manager-*.tar.gz
            qemu-web-manager-source-AGPLv3.tar.gz
            SHA256SUMS
