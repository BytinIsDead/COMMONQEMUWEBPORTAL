name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl
      - name: Build and smoke-test daemon + public API
        run: |
          make clean
          make CFLAGS='-std=c11 -O2 -Wall -Wextra -Wpedantic -D_POSIX_C_SOURCE=200809L'
          ./qemu-web-manager --port 18091 --public public >/tmp/test.log 2>&1 &
          PID=$!
          sleep 1
          curl -sf http://127.0.0.1:18091/api/v1/health
          echo
          curl -sf http://127.0.0.1:18091/api/v1/telemetry
          echo
          curl -sf http://127.0.0.1:18091/
          kill $PID
          rm -f qemu-web-manager src/*.o
      - uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            cc: gcc
            ldflags: ''
          - name: linux-arm64
            runner: ubuntu-24.04
            cc: aarch64-linux-gnu-gcc
            ldflags: ''
          - name: windows-x86_64
            runner: ubuntu-24.04
            cc: x86_64-w64-mingw32-gcc
            ldflags: '-lws2_32'
          - name: macos-x86_64
            runner: macos-14
            cc: clang
            cflags: '-std=c11 -O2 -Wall -Wextra -Wpedantic -D_POSIX_C_SOURCE=200809L -arch x86_64'
            ldflags: '-arch x86_64'
          - name: macos-arm64
            runner: macos-14
            cc: clang
            cflags: '-std=c11 -O2 -Wall -Wextra -Wpedantic -D_POSIX_C_SOURCE=200809L'
            ldflags: ''
          - name: freebsd-x86_64
            runner: ubuntu-24.04
            cc: clang
            ldflags: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchains
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64 gcc-aarch64-linux-gnu clang
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          QWM_CFLAGS: ${{ matrix.cflags || '-std=c11 -O2 -Wall -Wextra -Wpedantic -D_POSIX_C_SOURCE=200809L' }}
          QWM_LDFLAGS: ${{ matrix.ldflags || '' }}
        run: |
          make clean || true
          make CFLAGS="$QWM_CFLAGS" LDFLAGS="$QWM_LDFLAGS"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name='qemu-web-manager-${{ matrix.name }}'
          mkdir -p "$name/public"
          cp qemu-web-manager "$name/" 2>/dev/null || cp qemu-web-manager.exe "$name/" 2>/dev/null || true
          cp public/* "$name/public/"
          cp LICENSE LICENSE.md README.md ARCHITECTURE.md HARDWARE_MATRIX.md "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-web-manager-${{ matrix.name }}
          path: qemu-web-manager-${{ matrix.name }}.tar.gz
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: git archive --format=tar.gz --prefix=qemu-web-manager-source-AGPLv3/ HEAD > qemu-web-manager-source-AGPLv3.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-web-manager-source
          path: qemu-web-manager-source-AGPLv3.tar.gz
  release:
    needs: [build, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          find artifacts -type f -name '*.tar.gz' -exec cp {} . \;
          sha256sum qemu-web-manager-*.tar.gz qemu-web-manager-source-AGPLv3.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            qemu-web-manager-*.tar.gz
            qemu-web-manager-source-AGPLv3.tar.gz
            SHA256SUMS
